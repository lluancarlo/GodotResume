
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luan Resume</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            height: 100%;
            width: 100%;
        }

        #canvas_container {
            width: 100%;
            height: 100%;
            display: block;
        }

        #rotate-warning {
            display: none;
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: black;
            color: white;
            font-size: 2em;
            text-align: center;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        @media screen and (orientation: portrait) {
            canvas {
                display: none !important;
            }
            #rotate-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="rotate-warning">Por favor, gire seu dispositivo para modo paisagem.</div>
    <div id="canvas_container">
        <canvas id="canvas"></canvas>
    </div>

    <script src="godot.javascript"></script>
    <script>
        // Inicia o jogo
        const engine = new Engine();
        engine.startGame({
            canvas: document.getElementById('canvas'),
            onProgress: function(current, total) {
                console.log("Carregando: " + current + "/" + total);
            }
        });
    </script>
</body>
</html>
